name: Build Android Release APK

on:
  push:
    branches:
      - feat/personal-growth-desk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply compact safe-layout dark-gold UI
        run: node scripts/apply-responsive-dark-gold.js

      - name: Normalize React Native font weights
        run: |
          sed -i "s/fontWeight: '650'/fontWeight: '600'/g" App.tsx
          sed -i "s/fontWeight: '750'/fontWeight: '700'/g" App.tsx

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript exists
        run: |
          test -f android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle
          ls -lh android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Qi-v1.0.3-layout-icon-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qi-v1.0.3-layout-icon-release-apk
          path: dist/Qi-v1.0.3-layout-icon-release.apk
          if-no-files-found: error
          retention-days: 30
